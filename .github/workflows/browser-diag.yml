name: browser-diag (temporary)
on:
  push:
    branches: [claude/browser-diag]
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Which way of starting Chromium as an account with no window-server session survives a closed context, and gets Metal?
        run: |
          set +e
          mkdir -p /tmp/diag && cd /tmp/diag && npm i --no-save --silent playwright-core@1.64.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/diag-browsers npx playwright-core install chromium chromium-headless-shell >/dev/null 2>&1
          chmod -R a+rX /tmp/diag /tmp/diag-browsers
          cat > t.mjs <<'EOF'
          process.env.DEBUG = "pw:browser"
          const errs = []
          process.stderr.write = (c) => { for (const l of String(c).split("\n")) if (/ERROR|FATAL|Check failed|signal|exception/i.test(l) && !/cv_display_link|dbus|dock_plist|mach_vm_read/.test(l) && errs.length < 6) errs.push(l.slice(0, 220)); return true }
          const { chromium } = await import("/tmp/diag/node_modules/playwright-core/index.mjs")
          const [channel, ...args] = process.argv.slice(2)
          const out = []
          try {
            const b = await chromium.launch({ channel, headless: true, args })
            let gone = false; b.on("disconnected", () => { gone = true })
            const keep = await (await b.newContext()).newPage()
            const ren = async (p) => p.evaluate(() => { const g = document.createElement("canvas").getContext("webgl2"); const e = g && g.getExtension("WEBGL_debug_renderer_info"); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : String(!!g) })
            const c = await b.newContext(); const p = await c.newPage(); const r = await ren(p)
            const p2 = await c.newPage(); await p2.close()            // close one page, context stays
            await new Promise((r) => setTimeout(r, 1500))
            const afterPage = gone
            await c.close()                                            // close a whole context
            await new Promise((r) => setTimeout(r, 2500))
            out.push((gone ? "FAIL" : "ok") + " | page.close: " + (afterPage ? "crash" : "ok") + " | context.close: " + (gone ? "crash" : "ok") + " | renderer: " + r)
            if (!gone) await b.close()
          } catch (e) { out.push("FAIL launch: " + String(e.message).split("\n")[0]) }
          console.log(out.join("\n")); for (const l of errs) console.log("   ", l)
          EOF
          uid=4501; while dscl /Search -search /Users UniqueID $uid 2>/dev/null | grep -q .; do uid=$((uid+1)); done
          sudo dscl . -create /Users/diaguser
          sudo dscl . -create /Users/diaguser UniqueID $uid
          sudo dscl . -create /Users/diaguser PrimaryGroupID 20
          sudo dscl . -create /Users/diaguser UserShell /usr/bin/false
          sudo dscl . -create /Users/diaguser NFSHomeDirectory /tmp/diaghome
          sudo mkdir -p /tmp/diaghome && sudo chown $uid:20 /tmp/diaghome
          node=$(command -v node)
          ENVV="env PLAYWRIGHT_BROWSERS_PATH=/tmp/diag-browsers TMPDIR=/tmp/diaghome"
          run() { echo "== $1"; shift; (cd / && "$@" $ENVV "$node" /tmp/diag/t.mjs "${T[@]}" 2>&1 | tail -8); }
          GPU="--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
          T=(chromium);                         run "A asuser, chromium (aibox today)" sudo launchctl asuser $uid sudo -u diaguser -H
          T=(chromium);                         run "B plain sudo -u, chromium" sudo -u diaguser -H
          T=(chromium-headless-shell);          run "C asuser, headless shell" sudo launchctl asuser $uid sudo -u diaguser -H
          T=(chromium-headless-shell $GPU);     run "D asuser, headless shell + metal flags" sudo launchctl asuser $uid sudo -u diaguser -H
          T=(chromium-headless-shell --use-angle=metal); run "E asuser, headless shell + --use-angle=metal" sudo launchctl asuser $uid sudo -u diaguser -H
          T=(chromium-headless-shell $GPU);     run "F plain sudo -u, headless shell + metal flags" sudo -u diaguser -H
          T=(chromium);                         run "G bsexec 1 (system bootstrap), chromium" sudo launchctl bsexec 1 sudo -u diaguser -H
          T=(chromium-headless-shell $GPU);     run "H bsexec 1, headless shell + metal flags" sudo launchctl bsexec 1 sudo -u diaguser -H
          # I: a LaunchDaemon in the system domain with UserName (no asuser at all)
          for v in "chromium" "chromium-headless-shell --use-angle=metal --enable-gpu --ignore-gpu-blocklist"; do
            echo "== I LaunchDaemon UserName=diaguser: $v"
            args=""; for a in $v; do args="$args<string>$a</string>"; done
            sudo tee /Library/LaunchDaemons/diag.browser.plist >/dev/null <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Label</key><string>diag.browser</string><key>UserName</key><string>diaguser</string>
          <key>WorkingDirectory</key><string>/</string>
          <key>EnvironmentVariables</key><dict><key>PLAYWRIGHT_BROWSERS_PATH</key><string>/tmp/diag-browsers</string><key>TMPDIR</key><string>/tmp/diaghome</string><key>HOME</key><string>/tmp/diaghome</string></dict>
          <key>ProgramArguments</key><array><string>$node</string><string>/tmp/diag/t.mjs</string>$args</array>
          <key>StandardOutPath</key><string>/tmp/diaghome/daemon.out</string><key>StandardErrorPath</key><string>/tmp/diaghome/daemon.err</string></dict></plist>
          PL
            sudo rm -f /tmp/diaghome/daemon.out; sudo launchctl bootstrap system /Library/LaunchDaemons/diag.browser.plist
            for i in $(seq 1 40); do sudo test -s /tmp/diaghome/daemon.out && sudo grep -qE "^(ok|FAIL)" /tmp/diaghome/daemon.out && break; sleep 1; done
            sudo cat /tmp/diaghome/daemon.out | tail -8; sudo tail -3 /tmp/diaghome/daemon.err
            sudo launchctl bootout system/diag.browser 2>/dev/null; sudo rm -f /Library/LaunchDaemons/diag.browser.plist
          done
          sw_vers
