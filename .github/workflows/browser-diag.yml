name: browser-diag (temporary)
on:
  push:
    branches: [claude/browser-diag]
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: aibox's new server (headless shell + Metal, launchctl asuser, no-display account) with two clients
        run: |
          set +e
          uid=4501; while dscl /Search -search /Users UniqueID $uid 2>/dev/null | grep -q .; do uid=$((uid+1)); done
          sudo dscl . -create /Users/diaguser
          sudo dscl . -create /Users/diaguser UniqueID $uid
          sudo dscl . -create /Users/diaguser PrimaryGroupID 20
          sudo dscl . -create /Users/diaguser UserShell /usr/bin/false
          sudo dscl . -create /Users/diaguser NFSHomeDirectory /tmp/diaghome
          sudo mkdir -p /tmp/diaghome && sudo chown $uid:20 /tmp/diaghome
          node=$(command -v node)
          # The account's own install, the way aibox setup does it.
          sudo -u diaguser -H bash -c 'cd ~ && npm init -y >/dev/null && npm i --silent @playwright/test@1.64.0 >/dev/null && npx playwright install chromium >/dev/null 2>&1 && ls Library/Caches/ms-playwright'
          sudo -u diaguser -H tee /tmp/diaghome/serve.js >/dev/null <<'EOF'
          const { chromium } = require("@playwright/test");
          const wsPath = "/" + require("crypto").randomBytes(8).toString("hex");
          const fatal = e => { console.error(e); process.exit(1); };
          async function serve() {
            const s = await chromium.launchServer({ channel: "chromium-headless-shell", headless: true, args: ["--use-angle=metal"],
              host: "127.0.0.1", port: 3145, wsPath });
            console.log("Listening on " + s.wsEndpoint());
            s.on("close", () => { console.log(new Date().toISOString() + " browser exited - relaunching"); setTimeout(() => serve().catch(fatal), 1000); });
          }
          serve().catch(fatal);
          EOF
          (cd / && sudo launchctl asuser $uid sudo -u diaguser -H env PATH=$(dirname $node):/usr/bin:/bin bash -c 'cd ~ && DEBUG=pw:browser node serve.js' > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do grep -q "Listening on" /tmp/server.log && break; sleep 1; done
          url=$(grep -o 'ws://[^ ]*' /tmp/server.log | head -1); echo "server: $url"
          mkdir -p /tmp/cl && cd /tmp/cl && npm i --silent --no-save playwright-core@1.64.0 >/dev/null
          cat > c.mjs <<'EOF'
          import { chromium } from "playwright-core"
          const url = process.argv[2]
          const probe = (p) => p.evaluate(async () => {
            const g = document.createElement("canvas").getContext("webgl2"); const e = g && g.getExtension("WEBGL_debug_renderer_info")
            const gl = e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : String(!!g)
            let gpu = "no navigator.gpu"; if (navigator.gpu) { const a = await navigator.gpu.requestAdapter(); gpu = a ? "adapter ok" + (a.info ? " (" + (a.info.vendor || "") + " " + (a.info.architecture || "") + ")" : "") : "no adapter" }
            return gl + " | WebGPU: " + gpu })
          const a = await chromium.connect(url), b = await chromium.connect(url)
          let bGone = false; b.on("disconnected", () => { bGone = true })
          const bc = await b.newContext(), bp = await bc.newPage(); await bp.goto("about:blank")
          console.log("B before:", await probe(bp))
          for (let round = 1; round <= 3; round++) {
            const ac = await a.newContext(), ap = await ac.newPage(); console.log("A round " + round + ":", await probe(ap))
            const ap2 = await ac.newPage(); await ap2.close(); await ap.close(); await ac.close()
            await new Promise((r) => setTimeout(r, 1500))
            console.log("after A closed page+context (round " + round + "): B " + (bGone ? "DISCONNECTED" : "still connected"))
          }
          await a.close(); await new Promise((r) => setTimeout(r, 1500))
          console.log("after A disconnected: B " + (bGone ? "DISCONNECTED" : "still connected"))
          try { console.log("B after:", await probe(bp)); console.log(bGone ? "RESULT: FAIL" : "RESULT: PASS") } catch (e) { console.log("RESULT: FAIL B broken:", e.message.split("\n")[0]) }
          await b.close()
          EOF
          node c.mjs "$url" 2>&1 | tail -20
          echo "--- server log (relaunches / signals):"; grep -E "Listening|exited|signal|SIG" /tmp/server.log | tail -10
